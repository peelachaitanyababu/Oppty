<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>
        Lists
    </h1>
    <h2>
        Ordered list
    </h2>
    <ol type="I">
        <li>
            Book

        </li>
        <li>Pen</li>
        <li>phone</li>
        <li>watch</li>
        <li>laptop</li>
        <li>charger</li>
        <ul>
            <li>car</li>
            <li>Bike</li>
            <li>Bus</li>
        </ul>
    </ol>






    <h2>
        unordered list
    </h2>
    <ul style="list-style:square">
        <li>book</li>
        <li>pen</li>
        <li>Phone</li>
        <li>watch</li>
        <li>laptop</li>
    </ul>
    <h2>
        descrption list
    </h2>
    <dl>
        <dt>
            who
        </dt>
        <dd>
            world health org
        </dd>
        <dt>
            uno
        </dt>
        <dd>
            untied national org
        </dd>
    </dl>

    
</body>
</html>
