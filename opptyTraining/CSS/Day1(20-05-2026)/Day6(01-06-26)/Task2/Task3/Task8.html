<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppty ID Card</title>
    <link rel="stylesheet" href="./Task8.css">
</head>
<body>

    <div class="card">

       
        <div class="top-section">

           
            <div class="logo">
                OPPTY
            </div>

            <div class="company-name">
                <h1>OPPTY TECH HUB PVT LTD</h1>
            </div>

        </div>

     
        <div class="bottom-section">

            
            <div class="photo-box">
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="Male Image">
            </div>

        
            <div class="details">
                <p>ID : __________________</p>
                <p>Name : _______________</p>
                <p>Role : ________________</p>
                <p>D.O.B : ______________</p>
                <p>Address : _____________</p>
                <p>Phone : ______________</p>

                <div class="barcode"></div>

                <div class="signature">
                    <div class="line"></div>
                    <span>Manager</span>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
